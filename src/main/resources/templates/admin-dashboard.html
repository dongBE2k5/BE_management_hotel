<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển quản trị</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">

<div id="toast-notification"
     class="hidden fixed top-5 right-5 bg-green-500 text-white py-3 px-5 rounded-lg shadow-lg z-50 flex items-center gap-3 transition-all duration-300">
    <i class="bi bi-check-circle-fill"></i>
    <span id="toast-message">Nội dung thông báo ở đây</span>
</div>
<div class="flex">
    <div class="w-64 min-h-screen bg-gradient-to-b from-blue-800 to-blue-900 text-white p-4 fixed">
        <h2 class="text-2xl font-bold text-center py-6 mb-4">Admin Panel</h2>
        <nav>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-700 text-white font-semibold">
                <i class="bi bi-building"></i>
                <span>Quản lý Chủ khách sạn</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-blue-100 hover:bg-blue-700 hover:text-white transition-colors">
                <i class="bi bi-people"></i>
                <span>Quản lý Người dùng</span>
            </a>
        </nav>
    </div>

    <div class="ml-64 p-8 w-full">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="flex justify-between items-center p-5 border-b border-gray-200">
                <h3 class="text-2xl font-semibold text-gray-800">Danh sách Chủ khách sạn</h3>
                <a href="#" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center gap-2 transition-all">
                    <i class="bi bi-plus-lg"></i>
                    <span>Thêm mới</span>
                </a>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full whitespace-nowrap">
                    <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">#</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CCCD</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ngân hàng</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">STK</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CCCD Mặt Trước</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CCCD Mặt Sau</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Giấy phép KD</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Trạng thái</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Hành động</th>
                    </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="host, iterStat : ${hosts}">
                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${iterStat.count}"></td>
                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${host.cccd}"></td>
                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${host.nganHang}"></td>
                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${host.stk}"></td>

                        <td>
                            <img th:src="@{'/uploads/' + ${host.cccdMatTruoc}}" alt="CCCD Trước" class="w-16 h-10 object-cover rounded-md shadow-sm">
                        </td>
                        <td>
                            <img th:src="@{'/uploads/' + ${host.cccdMatSau}}" alt="CCCD Sau" class="w-16 h-10 object-cover rounded-md shadow-sm">
                        </td>
                        <td>
                            <img th:src="@{'/uploads/' + ${host.giayPhepKinhDoanh}}" alt="Giấy phép KD" class="w-16 h-10 object-cover rounded-md shadow-sm">
                        </td>

                        <td class="px-6 py-4">
                            <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
                                  th:classappend="
                                    (${host.status} == 'PENDING' ? 'bg-yellow-100 text-yellow-800' :
                                    (${host.status} == 'VERIFIED' ? 'bg-green-100 text-green-800' :
                                    (${host.status} == 'REJECTED' ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-800')))"
                                  th:text="${host.status}">
                            </span>
                        </td>

                        <td class="px-6 py-4 text-sm font-medium" th:switch="${host.status}">
                            <div class="flex items-center gap-2">
                                <form th:case="'PENDING'"
                                      th:action="@{/hosts/{id}(id=${host.userId})}"
                                      method="POST" class="inline">
                                    <input type="hidden" name="_method" value="PUT" />
                                    <input type="hidden" name="status" value="VERIFIED" />
                                    <button type="submit" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-1 px-3 rounded-full transition-colors cursor-pointer">
                                        Xác minh
                                    </button>
                                </form>

                                <div th:case="'VERIFIED'" class="flex gap-2">
                                    <form th:action="@{/hosts/{id}(id=${host.userId})}" method="POST" class="inline">
                                        <input type="hidden" name="_method" value="PUT" />
                                        <input type="hidden" name="status" value="REJECTED" />
                                        <button type="submit" class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-1 px-3 rounded-full transition-colors cursor-pointer">
                                            Từ chối
                                        </button>
                                    </form>
                                    <form th:action="@{/hosts/{id}(id=${host.userId})}" method="POST" class="inline">
                                        <input type="hidden" name="_method" value="PUT" />
                                        <input type="hidden" name="status" value="DISABLED" />
                                        <button type="submit" class="bg-gray-500 hover:bg-gray-600 text-white text-xs font-bold py-1 px-3 rounded-full transition-colors cursor-pointer">
                                            Vô hiệu hóa
                                        </button>
                                    </form>
                                </div>

                                <form th:case="*"
                                      th:action="@{/hosts/{id}(id=${host.userId})}"
                                      method="POST" class="inline">
                                    <input type="hidden" name="_method" value="PUT" />
                                    <input type="hidden" name="status" value="VERIFIED" />
                                    <button type="submit" class="bg-yellow-500 hover:bg-yellow-600 text-black text-xs font-bold py-1 px-3 rounded-full transition-colors cursor-pointer">
                                        Kích hoạt lại
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(hosts)}">
                        <td colspan="9" class="text-center py-10 text-gray-500 italic">
                            Không có dữ liệu chủ khách sạn nào
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
<script>
    document.addEventListener("DOMContentLoaded",()=>{

        // === THÊM MỚI 2: Biến timer và Hàm hiển thị Toast ===
        let toastTimer; // Biến để giữ timer, giúp reset nếu có toast mới

        function showToast(message) {
            const toast = document.getElementById("toast-notification");
            const toastMessage = document.getElementById("toast-message");

            if (!toast || !toastMessage) return;

            // 1. Đặt nội dung
            toastMessage.innerText = message;

            // 2. Hiện toast
            toast.classList.remove("hidden");

            // 3. Xóa timer cũ (nếu đang có 1 toast khác)
            if (toastTimer) {
                clearTimeout(toastTimer);
            }

            // 4. Tự động ẩn sau 3 giây
            toastTimer = setTimeout(() => {
                toast.classList.add("hidden");
            }, 3000); // 3000ms = 3 giây
        }
        // === KẾT THÚC THÊM MỚI 2 ===


        // --- Code WebSocket của bạn ---
        const  socket= new SockJS("/ws");
        const  stompClient=Stomp.over(socket);

        stompClient.connect({},(frame)=>{
            console.log("connected",frame)
            stompClient.subscribe('/topic/hosts',(message)=>{
                const payload = JSON.parse(message.body);

                // === THÊM MỚI 3: Gọi hàm showToast ===
                // Sửa lỗi: payload.message() không đúng, và logic nên ở đây
                if (payload.type === "NEWHOST"){
                    // Lấy message từ payload, hoặc dùng 1 message mặc định
                    const notificationMessage = payload.message || `Chủ khách sạn ${payload.data.cccd} vừa đăng ký.`;
                    showToast(notificationMessage);
                }
                // === KẾT THÚC THÊM MỚI 3 ===

                // Cập nhật bảng (vẫn giữ nguyên)
                addOrUpdateHostRow(payload.data)
            })
        })
        function addOrUpdateHostRow(host) {
            const tableBody = document.querySelector("table tbody");
            if (!tableBody) return;

            // Xóa dòng "Không có dữ liệu" nếu nó đang tồn tại
            const emptyRow = tableBody.querySelector("td[colspan='9']");
            if (emptyRow) {
                emptyRow.parentElement.remove();
            }

            const existingRow = Array.from(tableBody.children).find(
                row => row.querySelector("td:nth-child(2)")?.innerText === host.cccd
            );

            if (existingRow) {
                // Cập nhật hàng cũ
                existingRow.querySelector("td:nth-child(3)").innerText = host.nganHang;
                existingRow.querySelector("td:nth-child(4)").innerText = host.stk;
                existingRow.querySelector("td:nth-child(8) span").innerText = host.status;
                existingRow.querySelector("td:nth-child(8) span").className =
                    "px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full " + statusClass(host.status);
                // Cần cập nhật cả logic nút bấm ở đây nếu status thay đổi
            } else {
                // Thêm hàng mới
                const newRow = document.createElement("tr");
                newRow.innerHTML = `
                <td class="px-6 py-4 text-sm text-gray-700">NEW</td>
                <td class="px-6 py-4 text-sm text-gray-700">${host.cccd}</td>
                <td class="px-6 py-4 text-sm text-gray-700">${host.nganHang}</td>
                <td class="px-6 py-4 text-sm text-gray-700">${host.stk}</td>
                <td class="px-6 py-4"><img src="/uploads/${host.cccdMatTruoc}" class="w-16 h-10 object-cover rounded-md shadow-sm"></td>
                <td class="px-6 py-4"><img src="/uploads/${host.cccdMatSau}" class="w-16 h-10 object-cover rounded-md shadow-sm"></td>
                <td class="px-6 py-4"><img src="/uploads/${host.giayPhepKinhDoanh}" class="w-16 h-10 object-cover rounded-md shadow-sm"></td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass(host.status)}">
                        ${host.status}
                    </span>
                </td>
                <td class="px-6 py-4 text-sm font-medium">
                    <form action="/hosts/${host.userId}" method="POST" class="inline">
                        <input type="hidden" name="_method" value="PUT" />
                        <input type="hidden" name="status" value="VERIFIED" />
                        <button type="submit" class="bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-1 px-3 rounded-full transition-colors cursor-pointer">
                            Xác minh
                        </button>
                    </form>
                </td>
            `;
                // Thêm vào đầu bảng
                tableBody.prepend(newRow);
            }
        }

        function statusClass(status) {
            switch (status) {
                case "VERIFIED": return "bg-green-100 text-green-800";
                case "REJECTED": return "bg-red-100 text-red-800";
                case "PENDING": return "bg-yellow-100 text-yellow-800";
                default: return "bg-gray-100 text-gray-800";
            }
        }
    })

</script>
</html>
