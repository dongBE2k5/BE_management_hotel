<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:if="${#lists.isEmpty(hotels)}">
    <p class="text-center text-gray-500 italic">Chủ khách sạn này chưa có khách sạn nào.</p>
</div>

<div th:unless="${#lists.isEmpty(hotels)}" class="divide-y divide-gray-200">
    <div class="py-2 mb-3 text-right">
        <a th:href="@{/admin/hosts/{id}/hotels/new(id=${idUser})}"
           class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg text-sm">
            <i class="bi bi-plus-lg"></i> Thêm KS mới
        </a>
    </div>

    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ảnh</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tên khách sạn</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Địa chỉ</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Trạng thái</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Giá (VND)</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="hotel : ${hotels}">
                <td class="px-4 py-3">
                    <img th:src="@{ ${hotel.image}}" alt="Ảnh KS" class="w-16 h-10 object-cover rounded shadow-sm">
                </td>
                <td class="px-4 py-3 whitespace-nowrap">
                    <div class="text-sm font-semibold text-gray-900" th:text="${hotel.name}"></div>
                    <div class="text-xs text-gray-500" th:text="${hotel.phone}"></div>
                    <div class="text-xs text-gray-500" th:text="${hotel.email}"></div>
                </td>
                <td class="px-4 py-3 text-sm text-gray-600 max-w-xs whitespace-normal" th:text="${hotel.address}"></td>
                <td class="px-4 py-3 whitespace-nowrap">
                     <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
                           th:classappend="
                                (${hotel.status} == 'PENDING' ? 'bg-yellow-100 text-yellow-800' :
                                (${hotel.status} == 'VERIFIED' ? 'bg-green-100 text-green-800' :
                                (${hotel.status} == 'REJECTED' ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-800')))"
                           th:text="${hotel.status}">
                     </span>
                </td>
                <td class="px-4 py-3 text-sm text-gray-700 whitespace-nowrap">
                    <div th:text="${#numbers.formatDecimal(hotel.minPrice, 0, 'COMMA', 0, 'POINT')}"></div>
                    <div>-</div>
                    <div th:text="${#numbers.formatDecimal(hotel.maxPrice, 0, 'COMMA', 0, 'POINT')}"></div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
